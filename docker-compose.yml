services:
  db:
    image: postgres:16
    container_name: my-postgres
    environment:
      POSTGRES_USER: khai
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d

volumes:
  pgdata: